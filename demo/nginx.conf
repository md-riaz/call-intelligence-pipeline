# nginx reverse-proxy for call-intelligence-pipeline demo
#
# Listens on port 3433, proxies to gunicorn on 127.0.0.1:5000.
#
# Install:
#   sudo cp demo/nginx.conf /etc/nginx/sites-available/call-intelligence
#   sudo ln -s /etc/nginx/sites-available/call-intelligence \
#              /etc/nginx/sites-enabled/call-intelligence
#   sudo nginx -t && sudo systemctl reload nginx
#
# If you want HTTPS, wrap this server block with certbot:
#   sudo certbot --nginx -d your.domain.com

server {
    listen 3433;
    server_name _;          # replace with your domain or IP if needed

    # Audio files can be large — allow up to 200 MB uploads
    client_max_body_size 200M;

    # Gemini API calls can take 30–90 s per file; raise timeouts accordingly
    proxy_connect_timeout  30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ── All requests → gunicorn ────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ── Critical for Server-Sent Events (SSE) ─────────────────────────
        # SSE uses long-lived chunked HTTP connections.
        # nginx must NOT buffer the response — each "data: …\n\n" must be
        # forwarded to the browser immediately as it arrives.
        proxy_buffering             off;
        proxy_cache                 off;
        proxy_http_version          1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding   on;
    }
}
