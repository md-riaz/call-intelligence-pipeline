; supervisord config for call-intelligence-pipeline demo
;
; Place in /etc/supervisor/conf.d/call-intelligence.conf
; Adjust REPO_DIR to wherever you cloned the repo.
;
; Quick setup:
;   REPO_DIR=/opt/call-intelligence
;   git clone https://github.com/md-riaz/call-intelligence-pipeline "$REPO_DIR"
;   cd "$REPO_DIR"
;   python3 -m venv .venv
;   source .venv/bin/activate
;   pip install ".[gemini]"
;   pip install -r demo/requirements.txt
;   cp config.example.env config.env      # then add your GOOGLE_API_KEY
;
;   sudo cp demo/supervisor.conf /etc/supervisor/conf.d/call-intelligence.conf
;   sudo mkdir -p /var/log/call-intelligence
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start call-intelligence-demo

[program:call-intelligence-demo]

; ── Command ───────────────────────────────────────────────────────────────────
; gthread worker: one process, 4 threads — handles concurrent SSE connections
; without requiring gevent. Increase --threads for heavier concurrency.
command = /opt/call-intelligence/.venv/bin/gunicorn
          --bind 127.0.0.1:5000
          --workers 1
          --worker-class gthread
          --threads 4
          --timeout 300
          --keep-alive 65
          --access-logfile -
          --log-level info
          app:app

; If you install gevent (pip install gevent) you can use this instead —
; gevent handles many simultaneous SSE streams more efficiently:
; command = /opt/call-intelligence/.venv/bin/gunicorn
;           --bind 127.0.0.1:5000
;           --workers 2
;           --worker-class gevent
;           --timeout 300
;           app:app

; ── Paths ─────────────────────────────────────────────────────────────────────
directory       = /opt/call-intelligence/demo

; ── Process ───────────────────────────────────────────────────────────────────
user            = www-data
autostart       = true
autorestart     = true
startretries    = 5
stopasgroup     = true
killasgroup     = true

; ── Logging ───────────────────────────────────────────────────────────────────
stdout_logfile          = /var/log/call-intelligence/demo.out.log
stderr_logfile          = /var/log/call-intelligence/demo.err.log
stdout_logfile_maxbytes = 20MB
stderr_logfile_maxbytes = 20MB
stdout_logfile_backups  = 3
stderr_logfile_backups  = 3

; ── Environment ───────────────────────────────────────────────────────────────
environment = PYTHONUNBUFFERED="1"
; Add API keys here if you prefer not to use config.env:
; environment = PYTHONUNBUFFERED="1",GOOGLE_API_KEY="AIzaSy..."

; ── Reload after editing ──────────────────────────────────────────────────────
; sudo supervisorctl reread && sudo supervisorctl update
; sudo supervisorctl restart call-intelligence-demo
; sudo supervisorctl status
