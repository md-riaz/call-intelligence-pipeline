services:
  call-intelligence-demo:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: call-intelligence-pipeline:experiment
    container_name: call-intelligence-demo
    restart: unless-stopped
    # The current host's Docker bridge DNS cannot resolve external hosts.
    # Host networking lets both image builds and the running app use the host
    # network stack without changing the Docker daemon or production services.
    network_mode: host
    environment:
      PORT: "${PORT:-3433}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.1-flash-lite}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GOOGLE_API_KEYS: "${GOOGLE_API_KEYS:-}"
      GOOGLE_API_KEY_1: "${GOOGLE_API_KEY_1:-}"
      GOOGLE_API_KEY_2: "${GOOGLE_API_KEY_2:-}"
      GOOGLE_API_KEY_3: "${GOOGLE_API_KEY_3:-}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
      WEB_THREADS: "${WEB_THREADS:-4}"
      WEB_TIMEOUT: "${WEB_TIMEOUT:-300}"
    volumes:
      - ./samples:/app/samples:ro
      - ./transcripts:/app/transcripts
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os, urllib.request; urllib.request.urlopen(\"http://127.0.0.1:%s/\" % os.environ.get(\"PORT\", \"3433\"), timeout=3).read(1)'"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
