services:
  call-intelligence-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: call-intelligence-pipeline:experiment
    container_name: call-intelligence-pipeline
    restart: unless-stopped
    # The current host's Docker bridge DNS cannot resolve external hosts.
    # Host networking lets both image builds and the running app use the host
    # network stack without changing the Docker daemon or production services.
    network_mode: host
    environment:
      PORT: "${PORT:-3433}"
      MODEL_PROVIDER: "${MODEL_PROVIDER:-whisper-bn}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      WHISPER_MODEL: "${WHISPER_MODEL:-bitwisemind/sam_15000_clean_text_full_model}"
      HF_HOME: "${HF_HOME:-/models}"
      TRANSFORMERS_CACHE: "${TRANSFORMERS_CACHE:-/models}"
      CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES:-0}"
      ASR_BATCH_SIZE: "${ASR_BATCH_SIZE:-2}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
      WEB_THREADS: "${WEB_THREADS:-4}"
      WEB_TIMEOUT: "${WEB_TIMEOUT:-300}"
    volumes:
      - ./samples:/app/samples:ro
      - ./transcripts:/app/transcripts
      - call-intelligence-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c 'import os, urllib.request; urllib.request.urlopen("http://127.0.0.1:%s/" % os.environ.get("PORT", "3433"), timeout=3).read(1)'
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Optional second GPU worker. Use with a different PORT to avoid host-network
  # conflicts, for example:
  #   PORT=3434 CUDA_VISIBLE_DEVICES=1 docker compose up -d call-intelligence-pipeline-gpu1
  call-intelligence-pipeline-gpu1:
    profiles: ["gpu1"]
    extends:
      service: call-intelligence-pipeline
    container_name: call-intelligence-pipeline-gpu1
    environment:
      PORT: "${PORT_GPU1:-3434}"
      MODEL_PROVIDER: "${MODEL_PROVIDER_GPU1:-whisper-bn}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      WHISPER_MODEL: "${WHISPER_MODEL:-bitwisemind/sam_15000_clean_text_full_model}"
      HF_HOME: "${HF_HOME:-/models}"
      TRANSFORMERS_CACHE: "${TRANSFORMERS_CACHE:-/models}"
      CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES_GPU1:-1}"
      ASR_BATCH_SIZE: "${ASR_BATCH_SIZE:-2}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY_GPU1:-1}"
      WEB_THREADS: "${WEB_THREADS_GPU1:-2}"
      WEB_TIMEOUT: "${WEB_TIMEOUT:-300}"

volumes:
  call-intelligence-models:
