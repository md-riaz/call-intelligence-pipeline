[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "call-intelligence-pipeline"
version = "1.0.0"
description = "Transcribe call recordings and analyze quality — speaker separation, sentiment, FCR, agent scoring, and coaching tips."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "call-intelligence-pipeline contributors" }]
keywords = ["call-center", "speech-to-text", "asr", "call-quality", "qa", "transcription", "sentiment", "gemini", "bengali"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.optional-dependencies]
# Google Gemini backend — best Bengali accuracy, free tier 20–500 RPD.
gemini = ["google-genai>=1.0.0"]
# Reporting helpers (CSV/Excel export).
reports = ["pandas", "openpyxl", "jinja2"]
dev = ["pytest", "ruff"]

[project.scripts]
transcribe = "transcribe.cli:main"
transcribe-analyze = "transcribe.analyze_cli:main"

[project.urls]
Homepage = "https://github.com/md-riaz/call-intelligence-pipeline"
Issues = "https://github.com/md-riaz/call-intelligence-pipeline/issues"

[tool.setuptools]
packages = ["transcribe"]
